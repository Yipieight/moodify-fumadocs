        message:
          type: string
          description: Mensaje de respuesta
          example: Inicio de sesión exitoso

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - uptime
        - version
        - environment
        - checks
      properties:
        status:
          type: string
          enum:
            - healthy
          example: healthy
        timestamp:
          type: string
          format: date-time
          example: '2025-10-20T12:00:00.000Z'
        uptime:
          type: number
          description: Tiempo de actividad del servidor en segundos
          example: 86400
        version:
          type: string
          description: Versión de la aplicación
          example: 1.0.0
        environment:
          type: string
          description: Entorno de ejecución
          example: production
        checks:
          type: object
          required:
            - server
            - memory
            - env
          properties:
            server:
              type: string
              example: ok
            memory:
              type: object
              required:
                - rss
                - heapTotal
                - heapUsed
                - external
              properties:
                rss:
                  type: integer
                  description: Resident Set Size en MB
                  example: 256
                heapTotal:
                  type: integer
                  description: Tamaño total del heap en MB
                  example: 128
                heapUsed:
                  type: integer
                  description: Tamaño del heap usado en MB
                  example: 64
                external:
                  type: integer
                  description: Memoria externa en MB
                  example: 8
            env:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  example: ok
                missing:
                  type: array
                  items:
                    type: string
                  description: Variables de entorno requeridas faltantes

    UnhealthyResponse:
      type: object
      required:
