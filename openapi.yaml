            tracks:
              type: array
              items:
                $ref: '#/components/schemas/Track'
              description: Pistas coincidentes
            totalTracks:
              type: integer
              description: Número de pistas devueltas
              example: 15
            searchedAt:
              type: string
              format: date-time
              description: Marca de tiempo de búsqueda
              example: '2025-10-20T12:00:00.000Z'

    TrackDetailsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Track'
